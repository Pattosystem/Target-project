<!DOCTYPE html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>管理画面 — 3か月目標ロードマップ</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{--navy:#123c63;--navy-2:#2b5d8a;--ink:#243244;--stone:#8a939e;--green:#4a9d5f;
        --red:#e0453a;--line:rgba(18,60,99,.12);
        --sans:"Noto Sans JP",'Hiragino Sans',sans-serif;--mono:"Roboto Mono",monospace}
  *{box-sizing:border-box}
  body{margin:0;background:#eef2f6;color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.7;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1100px;margin:0 auto;padding:22px 16px 80px}
  button{font-family:var(--sans);cursor:pointer}
  :focus-visible{outline:2px solid var(--red);outline-offset:2px}
  .hidden{display:none!important}
  input,select,textarea{font-family:var(--sans);font-size:15px;background:#fafbfc;border:1px solid var(--line);
    border-bottom:2px solid var(--navy-2);padding:8px 11px;width:100%;border-radius:3px;color:var(--ink)}
  label{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.13em;color:var(--stone);margin-bottom:5px}
  .btn{background:none;border:1px solid var(--navy);color:var(--navy);padding:6px 15px;border-radius:999px;font-size:12.5px;font-weight:500}
  .btn-solid{background:var(--navy);color:#fff}
  .err{color:var(--red);font-size:12.5px;margin-top:10px;min-height:1em}

  .login{max-width:380px;margin:11vh auto;background:#fff;border-radius:10px;padding:30px 28px;box-shadow:0 14px 40px -20px rgba(18,60,99,.5)}
  .login h1{margin:0 0 4px;font-size:20px;font-weight:900;color:var(--navy)}
  .login p{margin:0 0 20px;font-size:12.5px;color:var(--stone)}
  .login label{margin-top:12px}

  .deny{max-width:440px;margin:14vh auto;background:#fff;border-radius:10px;padding:30px 28px;text-align:center;
        box-shadow:0 14px 40px -20px rgba(18,60,99,.5)}
  .deny h1{margin:0 0 8px;font-size:19px;color:var(--navy)}
  .deny p{font-size:13.5px;color:var(--stone);margin:0 0 20px}

  header.top{background:#fff;border-radius:10px 10px 0 0;padding:16px 22px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  header.top h1{margin:0;font-size:19px;font-weight:900;color:var(--navy)}
  header.top .lock{background:var(--navy);color:#fff;font-size:10.5px;border-radius:4px;padding:2px 9px}
  header.top .sp{margin-left:auto;display:flex;gap:8px;align-items:center;font-size:12px;color:var(--stone)}

  .tabs{display:flex;gap:4px;padding:0 22px;background:#fff;border-bottom:1px solid var(--line)}
  .tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:9px 15px;font-size:13px;font-weight:700;color:var(--stone)}
  .tabs button.on{color:var(--navy);border-bottom-color:var(--navy)}
  .apane{background:#fff;border-radius:0 0 10px 10px;padding:18px 22px 26px;box-shadow:0 10px 30px -18px rgba(18,60,99,.5)}

  .atable{width:100%;border-collapse:collapse;font-size:12.5px}
  .atable th{text-align:left;font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;color:var(--stone);font-weight:400;padding:0 6px 6px;white-space:nowrap}
  .atable td{padding:3px 6px;vertical-align:middle}
  .atable input,.atable select{padding:5px 7px;font-size:12.5px;border-bottom-width:1px}
  .atable input[type=number]{width:74px;font-size:12.5px;text-align:right}
  .atable input[type=color]{width:38px;height:28px;padding:2px;cursor:pointer}
  .atable input[type=checkbox]{width:auto}
  .w-name{width:120px}.w-dept{width:120px}.w-uid{width:150px}.w-title{width:100%;min-width:170px}
  .w-unit{width:56px}.w-ord{width:52px}.w-reason{width:150px}
  .scroll{overflow-x:auto}
  .abtn{background:var(--navy);color:#fff;border:0;border-radius:4px;padding:5px 11px;font-size:11.5px;white-space:nowrap}
  .abtn.ghost{background:none;color:var(--stone);border:1px solid var(--line)}
  .abtn.danger{background:none;color:var(--red);border:1px solid var(--red)}
  .abtn:disabled{opacity:.4;cursor:not-allowed}
  .asec{margin-bottom:18px;border:1px solid var(--line);border-radius:7px;overflow:hidden}
  .asec>h4{margin:0;padding:7px 12px;background:#f6f9fc;font-size:13px;display:flex;align-items:center;gap:9px}
  .asec>h4 .sprite{height:26px}
  .asec>h4 span{margin-left:auto;font-weight:400;font-size:11px;color:var(--stone)}
  .asec .inner{padding:8px 12px 12px}
  .amsg{font-size:12px;margin:10px 0 0;min-height:1.2em}
  .amsg.ok{color:var(--green)}.amsg.ng{color:var(--red)}
  .ahint{font-size:11.5px;color:var(--stone);background:#f6f9fc;border-radius:5px;padding:10px 13px;margin-bottom:14px}
  .newrow{border-top:1px dashed var(--line);margin-top:8px;padding-top:8px}
</style>

<div id="loginView" class="login hidden">
  <h1>管理画面</h1>
  <p>管理者のアカウントでログインしてください</p>
  <label for="email">EMAIL</label><input type="email" id="email" autocomplete="username">
  <label for="pw">PASSWORD</label><input type="password" id="pw" autocomplete="current-password">
  <p class="err" id="loginErr"></p>
  <button class="btn btn-solid" id="loginBtn" style="width:100%;padding:9px">ログイン</button>
</div>

<div id="denyView" class="deny hidden">
  <h1>この画面は管理者専用です</h1>
  <p id="denyMsg">ログインは確認できましたが、管理者権限がありません。</p>
  <a class="btn" href="./index.html">ボードに戻る</a>
  <button class="btn" id="denyLogout">ログアウト</button>
</div>

<div class="wrap hidden" id="adminView">
  <header class="top">
    <h1>管理画面</h1><span class="lock">管理者専用</span>
    <span class="sp"><span id="whoName"></span>
      <a class="btn" href="./index.html">ボードを見る</a>
      <button class="btn" id="logoutBtn">ログアウト</button></span>
  </header>
  <div class="tabs">
    <button data-tab="emp">社員</button>
    <button data-tab="goal">目標</button>
    <button data-tab="period">期間</button>
  </div>
  <div class="apane" id="apane"></div>
</div>

const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const $ = id => document.getElementById(id);

let ME = null, ATAB = 'emp';
let ADMIN = { emps:[], goals:[], periods:[], cur:null };

/* ── 入口の判定 ───────────────────────── */
$('loginBtn').addEventListener('click', async () => {
  $('loginErr').textContent = ''; $('loginBtn').disabled = true;
  const { error } = await sb.auth.signInWithPassword({
    email: $('email').value.trim(), password: $('pw').value });
  $('loginBtn').disabled = false;
  if (error) $('loginErr').textContent = 'ログインできませんでした：' + error.message;
});
$('pw').addEventListener('keydown', e => { if (e.key === 'Enter') $('loginBtn').click(); });
const logout = async () => { await sb.auth.signOut(); location.reload(); };
$('logoutBtn').addEventListener('click', logout);
$('denyLogout').addEventListener('click', logout);

sb.auth.onAuthStateChange((_e, s) => { s ? gate() : view('login'); });
const { data:{ session } } = await sb.auth.getSession();
session ? gate() : view('login');

function view(which){
  $('loginView').classList.toggle('hidden', which !== 'login');
  $('denyView').classList.toggle('hidden',  which !== 'deny');
  $('adminView').classList.toggle('hidden', which !== 'admin');
}

async function gate(){
  const { data:{ user } } = await sb.auth.getUser();
  const { data: emp } = await sb.from('employees').select('*').eq('user_id', user.id).maybeSingle();
  if (!emp){ $('denyMsg').textContent = 'このアカウントは社員として登録されていません。'; return view('deny'); }
  if (!emp.is_admin){ $('denyMsg').textContent = `${emp.name} さんには管理者権限がありません。`; return view('deny'); }
  ME = emp;
  $('whoName').textContent = emp.name;
  view('admin');
  document.querySelectorAll('.tabs button').forEach(b =>
    b.addEventListener('click', () => { ATAB = b.dataset.tab; render(); }));
  await loadAdmin(); render();
}

/* ── データ ───────────────────────────── */
const SPRITE_NAMES = {1:'黒',2:'青',3:'緑',4:'赤',5:'黄',6:'グレー',7:'ピンク',8:'水色'};
const spriteOptions = v => Object.entries(SPRITE_NAMES)
  .map(([k,n])=>`<option value="${k}"${+v===+k?' selected':''}>${k}. ${n}</option>`).join('');

async function loadAdmin(){
  const [{data:emps}, {data:periods}] = await Promise.all([
    sb.from('employees').select('*').order('sort_order'),
    sb.from('periods').select('*').order('starts_on', {ascending:false})
  ]);
  const cur = (periods||[]).find(p=>p.is_current) || null;
  let goals = [];
  if (cur){
    const { data } = await sb.from('goals').select('*').eq('period_id', cur.id).order('sort_order');
    goals = data || [];
  }
  ADMIN = { emps: emps||[], goals, periods: periods||[], cur };
}

function render(){
  document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on', b.dataset.tab===ATAB));
  $('apane').innerHTML = ATAB==='emp' ? empHTML() : ATAB==='goal' ? goalHTML() : periodHTML();
  wire();
}

/* ── 社員 ── */
function empHTML(){
  const row = e => `
    <tr data-emp="${e ? e.id : 'new'}">
      <td><input class="w-name" data-f="name" value="${e?e.name:''}" placeholder="氏名"></td>
      <td><input class="w-dept" data-f="dept" value="${e?e.dept:''}" placeholder="部署"></td>
      <td><select data-f="sprite">${spriteOptions(e?e.sprite:1)}</select></td>
      <td><input type="color" data-f="color" value="${e?e.color:'#2f6fb0'}"></td>
      <td><input type="number" class="w-ord" data-f="sort_order" value="${e?e.sort_order:0}"></td>
      <td style="text-align:center"><input type="checkbox" data-f="is_admin" ${e&&e.is_admin?'checked':''}></td>
      <td style="text-align:center"><input type="checkbox" data-f="active" ${!e||e.active?'checked':''}></td>
      <td><input class="w-uid" data-f="user_id" value="${e&&e.user_id?e.user_id:''}" placeholder="未連携"></td>
      <td><button class="abtn" data-save-emp="${e?e.id:'new'}">${e?'保存':'追加'}</button></td>
    </tr>`;
  return `
    <p class="ahint">ログイン用のアカウントは Supabase の Authentication → Users で作ります。
      作成後に出る UID を「USER ID」欄に貼ると、その人がログインできるようになります。
      先に氏名と目標だけ登録して、UIDは後から入れても構いません。
      <b>管理者</b>にチェックを入れた人は、この管理画面に入れるようになります。</p>
    <div class="scroll"><table class="atable">
      <tr><th>氏名</th><th>部署</th><th>選手</th><th>色</th><th>並び</th><th>管理者</th><th>在籍</th><th>USER ID</th><th></th></tr>
      ${ADMIN.emps.map(row).join('')}
      <tr><td colspan="9" style="padding-top:12px"><b style="font-size:11.5px;color:var(--stone)">新しく追加</b></td></tr>
      ${row(null)}
    </table></div>
    <p class="amsg" id="amsg"></p>`;
}

/* ── 目標 ── */
function goalHTML(){
  if (!ADMIN.cur) return `<p class="ahint">現在の期間が設定されていません。「期間」タブで設定してください。</p>`;
  const gRow = (emp, g) => `
    <tr data-goal="${g?g.id:'new'}" data-emp="${emp.id}">
      <td><input class="w-title" data-f="title" value="${g?g.title.replace(/"/g,'&quot;'):''}" placeholder="目標の内容"></td>
      <td><input class="w-unit" data-f="unit" value="${g?g.unit:''}" placeholder="件"></td>
      <td><input type="number" data-f="start_value" value="${g?g.start_value:0}" step="any"></td>
      <td><input type="number" data-f="target_value" value="${g?g.target_value:0}" step="any"></td>
      <td><select data-f="direction">
        <option value="up"${!g||g.direction==='up'?' selected':''}>増やす</option>
        <option value="down"${g&&g.direction==='down'?' selected':''}>減らす</option></select></td>
      <td style="text-align:center"><input type="checkbox" data-f="is_primary" ${g&&g.is_primary?'checked':''}></td>
      <td><input type="number" class="w-ord" data-f="sort_order" value="${g?g.sort_order:0}"></td>
      <td>${g?'<input class="w-reason" data-f="change_reason" placeholder="変更理由">':''}</td>
      <td><button class="abtn" data-save-goal="${g?g.id:'new'}">${g?'保存':'追加'}</button>
        ${g?`<button class="abtn danger" data-del-goal="${g.id}">削除</button>`:''}</td>
    </tr>`;
  const head = `<tr><th>目標</th><th>単位</th><th>期首</th><th>目標値</th><th>方向</th><th>本命</th><th>並び</th><th>変更理由</th><th></th></tr>`;
  return `
    <p class="ahint">「期首」は期間が始まった時点の数字です。ここが空だと達成率が正しく出ません。
      誤出荷のように減らす目標は「方向」を減らすにしてください。
      登録済みの目標を変えるときは変更理由が必須です。全員に見える履歴に残ります。</p>
    ${ADMIN.emps.filter(e=>e.active).map(e=>{
      const gs = ADMIN.goals.filter(g=>g.employee_id===e.id);
      return `<div class="asec">
        <h4><img class="sprite" src="${R[e.sprite]||R[1]}" alt="">${e.name}<span>${e.dept}　目標${gs.length}件</span></h4>
        <div class="inner scroll"><table class="atable">${head}
          ${gs.map(g=>gRow(e,g)).join('')}
          <tr class="newrow"><td colspan="9" style="padding-top:6px">
            <b style="font-size:11.5px;color:var(--stone)">この人に目標を追加</b></td></tr>
          ${gRow(e,null)}
        </table></div></div>`;
    }).join('')}
    <p class="amsg" id="amsg"></p>`;
}

/* ── 期間 ── */
function periodHTML(){
  return `
    <p class="ahint"><b>発表会の日</b>を起点に、1か月ごとの報告期日が自動で計算されます（8月23日なら 9/23・10/23・11/23）。
      「現在」に設定された期間だけがボードに表示されます。
      期が変わったら新しい期間を追加して切り替えてください。前の期の目標と記録はそのまま残ります。</p>
    <div class="scroll"><table class="atable">
      <tr><th>名称</th><th>発表会の日</th><th>開始</th><th>終了</th><th>状態</th><th></th></tr>
      ${ADMIN.periods.map(p=>`
        <tr data-period="${p.id}">
          <td><input data-f="name" value="${p.name}" style="width:190px"></td>
          <td><input type="date" data-f="kickoff_on" value="${p.kickoff_on||''}"></td>
          <td><input type="date" data-f="starts_on" value="${p.starts_on}"></td>
          <td><input type="date" data-f="ends_on" value="${p.ends_on}"></td>
          <td>${p.is_current?'<b style="color:var(--green)">現在</b>':'<span style="color:var(--stone)">―</span>'}</td>
          <td><button class="abtn" data-save-period="${p.id}">保存</button>
            ${p.is_current?'':`<button class="abtn ghost" data-cur-period="${p.id}">現在にする</button>`}</td>
        </tr>`).join('')}
      <tr><td colspan="6" style="padding-top:12px"><b style="font-size:11.5px;color:var(--stone)">新しい期間</b></td></tr>
      <tr data-period="new">
        <td><input data-f="name" placeholder="2026年 12月〜2月" style="width:190px"></td>
        <td><input type="date" data-f="kickoff_on"></td>
        <td><input type="date" data-f="starts_on"></td>
        <td><input type="date" data-f="ends_on"></td><td></td>
        <td><button class="abtn" data-save-period="new">追加</button></td>
      </tr>
    </table></div>
    <p class="amsg" id="amsg"></p>`;
}

/* ── 保存 ── */
const rowValues = tr => {
  const o = {};
  tr.querySelectorAll('[data-f]').forEach(el=>{
    o[el.dataset.f] = el.type==='checkbox' ? el.checked
                    : el.type==='number'   ? (el.value===''?null:Number(el.value))
                    : el.value.trim();
  });
  return o;
};
const msg = (t, ok) => { const m = $('amsg'); if(m){ m.textContent = t; m.className = 'amsg ' + (ok?'ok':'ng'); } };
const refresh = async () => { await loadAdmin(); render(); };

function wire(){
  document.querySelectorAll('[data-save-emp]').forEach(b=>b.addEventListener('click', async ()=>{
    const v = rowValues(b.closest('tr')), id = b.dataset.saveEmp;
    if (!v.name || !v.dept) return msg('氏名と部署は必須です', false);
    if (!v.user_id) v.user_id = null;
    b.disabled = true;
    const { error } = id==='new' ? await sb.from('employees').insert(v)
                                 : await sb.from('employees').update(v).eq('id', id);
    b.disabled = false;
    if (error) return msg('保存できませんでした：' + error.message, false);
    msg(`${v.name} さんを${id==='new'?'追加':'保存'}しました`, true);
    await refresh();
  }));

  document.querySelectorAll('[data-save-goal]').forEach(b=>b.addEventListener('click', async ()=>{
    const tr = b.closest('tr'), v = rowValues(tr), id = b.dataset.saveGoal;
    if (!v.title || !v.unit) return msg('目標の内容と単位は必須です', false);
    if (v.start_value === v.target_value) return msg('期首と目標値が同じです', false);
    b.disabled = true;
    let error;
    if (id === 'new'){
      delete v.change_reason;
      ({ error } = await sb.from('goals').insert({ ...v, employee_id: tr.dataset.emp, period_id: ADMIN.cur.id }));
    } else {
      if (!v.change_reason){ b.disabled = false; return msg('変更理由を入れてください（履歴に残ります）', false); }
      ({ error } = await sb.from('goals').update(v).eq('id', id));
    }
    b.disabled = false;
    if (error) return msg('保存できませんでした：' + error.message, false);
    msg(id==='new' ? '目標を追加しました' : '目標を保存しました（変更履歴に残りました）', true);
    await refresh();
  }));

  document.querySelectorAll('[data-del-goal]').forEach(b=>b.addEventListener('click', async ()=>{
    if (!confirm('この目標を削除します。これまでの進捗の記録も一緒に消えます。よろしいですか？')) return;
    b.disabled = true;
    const { error } = await sb.from('goals').delete().eq('id', b.dataset.delGoal);
    b.disabled = false;
    if (error) return msg('削除できませんでした：' + error.message, false);
    msg('削除しました', true); await refresh();
  }));

  document.querySelectorAll('[data-save-period]').forEach(b=>b.addEventListener('click', async ()=>{
    const v = rowValues(b.closest('tr')), id = b.dataset.savePeriod;
    if (!v.name || !v.starts_on || !v.ends_on) return msg('名称と開始・終了日は必須です', false);
    if (!v.kickoff_on) v.kickoff_on = null;
    b.disabled = true;
    const { error } = id==='new' ? await sb.from('periods').insert(v)
                                 : await sb.from('periods').update(v).eq('id', id);
    b.disabled = false;
    if (error) return msg('保存できませんでした：' + error.message, false);
    msg('保存しました', true); await refresh();
  }));

  document.querySelectorAll('[data-cur-period]').forEach(b=>b.addEventListener('click', async ()=>{
    if (!confirm('この期間を「現在」に切り替えます。ボードの表示が入れ替わります。よろしいですか？')) return;
    b.disabled = true;
    await sb.from('periods').update({is_current:false}).neq('id','00000000-0000-0000-0000-000000000000');
    const { error } = await sb.from('periods').update({is_current:true}).eq('id', b.dataset.curPeriod);
    b.disabled = false;
    if (error) return msg('切り替えできませんでした：' + error.message, false);
    msg('現在の期間を切り替えました', true); await refresh();
  }));
}
</script>
</html>
